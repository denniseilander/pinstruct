name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# NOTE: no concurrency block on purpose. As of 2026-07-25 any workflow-level
# concurrency setting in this repo makes runs die at startup with a GitHub-side
# internal server error (zero jobs created). Re-add once GitHub fixes it:
#   concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build:css

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html tailwind.css robots.txt sitemap.xml llms.txt _site/
          cp -R assets _site/assets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
