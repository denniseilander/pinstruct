name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build:css

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html tailwind.css robots.txt sitemap.xml llms.txt _headers _site/
          cp -R assets _site/assets

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 3a697dea3fa91343def5ec41ebef7d73
          command: pages deploy _site --project-name=pinstruct --branch=main
